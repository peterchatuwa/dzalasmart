version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nzeru-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nzeru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-nzeru}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzeru"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nzeru-backend

  app:
    build:
      context: .
      target: production
    container_name: nzeru-app-prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-nzeru}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nzeru}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nzeru-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: nzeru-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - nzeru-backend
    profiles:
      - with-proxy

volumes:
  postgres_data:
    driver: local

networks:
  nzeru-backend:
    driver: bridge
